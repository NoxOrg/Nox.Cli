name: Review Code Quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - .github/workflows/nox_code_quality.yaml
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup .NET Core SDK 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
            
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v3
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
            
      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          New-Item -Path ./.sonar/scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner
        shell: pwsh

      - name: Restore
        run: dotnet restore ./src/Nox.Cli

      - name: Analyze
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"NoxOrg_Nox.Cli" /o:"noxorg" /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
          dotnet build ./src/Nox.Cli --warnaserror --configuration Release --no-incremental --no-restore -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
        shell: pwsh

      - name: Build (without Sonar token)
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: dotnet build ./src/Nox.Cli --warnaserror --configuration Release --no-incremental --no-restore -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
        shell: pwsh
        #### <-- add back after 'dotnet build' line above when tests are working
        #dotnet tool install --global dotnet-coverage
        #dotnet-coverage collect 'dotnet test ./src' -f xml  -o 'coverage.xml'
